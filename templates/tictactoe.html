<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe! ❌⭕</title>
    <meta name="description" content="Play Tic Tac Toe against a friend!">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="game-body tictactoe-theme">
    <div class="container text-center">
        <div class="header">
            <a href="/" class="btn back-btn">⬅️ Back to Menu</a>
            <h1>❌ Tic Tac Toe ⭕</h1>
        </div>
        
        <div class="game-container">
            <div class="status-board" id="statusBoard">
                Player X's Turn!
            </div>
            
            <div class="board" id="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>
            
            <div class="controls">
                <button id="resetBtn" class="btn play-btn">Play Again! 🔄</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/tictactoe.js') }}"></script>
</body>
</html>
