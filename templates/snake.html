<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game! 🐍</title>
    <meta name="description" content="Play the classic Snake game!">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="game-body snake-theme">
    <div class="container text-center">
        <div class="header">
            <a href="/" class="btn back-btn">⬅️ Back to Menu</a>
            <h1>🐍 Super Snake!</h1>
        </div>
        
        <div class="game-container">
            <div class="score-board">
                Score: <span id="score">0</span>
                <span class="high-score">High Score: <span id="highScore">0</span></span>
            </div>
            
            <canvas id="snakeCanvas" width="400" height="400"></canvas>
            
            <div class="controls-hint">
                <p>Use arrow keys to move! ⬆️ ⬇️ ⬅️ ➡️</p>
                <button id="startBtn" class="btn play-btn">Play Game! 🎮</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/snake.js') }}"></script>
</body>
</html>
